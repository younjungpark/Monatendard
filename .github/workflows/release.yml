name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer 버전 (예: 0.1.0-beta.1)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run monatendard fetch
      - run: uv run monatendard build --all
      - run: uv run monatendard verify --reproducible
      - run: uv run monatendard build-nerd --all
      - run: uv run monatendard verify --nerd --reproducible
      - name: 버전 결정
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - run: uv run monatendard package --version "${{ steps.version.outputs.value }}"
      - name: 체크섬 검증
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/Monatendard-*.zip
            dist/SHA256SUMS.txt

  update-font-casks:
    needs: build-release
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    uses: ./.github/workflows/update-font-casks.yml
    with:
      tag: v${{ needs.build-release.outputs.version }}

  update-font-scoop:
    needs: build-release
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    uses: ./.github/workflows/update-font-scoop.yml
    with:
      tag: v${{ needs.build-release.outputs.version }}
