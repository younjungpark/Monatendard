[project]
name = "monatendard"
version = "0.3.0"
description = "Monaspace Neon과 Pretendard를 결합한 한글 코딩 글꼴 빌드 도구"
readme = "README.ko.md"
requires-python = ">=3.11"
dependencies = [
    "brotli>=1.1.0",
    "fonttools>=4.59.0",
]

[project.urls]
Homepage = "https://monatendard.github.io/"

[project.scripts]
monatendard = "monatendard.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = ["--tb=short", "--basetemp=.pytest_tmp"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
